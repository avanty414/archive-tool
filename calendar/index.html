<h1>XeneonGoogleCalendarSync</h1>
<p>XeneonGoogleCalendarSync は、持ち主が自分のためだけに作った個人用の道具です。</p>
<ul>
<li>持ち主の Google カレンダーの予定を読み取り、持ち主のパソコンの中のファイルに書き出します。</li>
<li>持ち主はそれを、机の上の小さな画面(Corsair XENEON EDGE)のカレンダー表示で見ます。</li>
<li>予定を書き換えたり、消したりはしません。</li>
<li>使うのは持ち主1人だけです。一般への公開や配布はしていません。</li>
</ul>
